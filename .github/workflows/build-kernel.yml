name: Build gts6lwifi kernel

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "Checkout this repo (config/patches/drivers/dts)"
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev u-boot-tools cpio rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone mainline 6.12 (shallow)
        run: |
          cd /mnt
          git clone --depth 1 --branch v6.12 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux
          cd linux
          git log -1 --oneline

      - name: Apply device patches
        working-directory: /mnt/linux
        run: |
          for p in $GITHUB_WORKSPACE/kernel/patches/*.patch; do
            echo "== $(basename $p) =="
            patch -p1 --forward < "$p" || echo "!! patch failed (continuing): $(basename $p)"
          done

      - name: Install device drivers
        working-directory: /mnt/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/drivers/fts1ba90a.c drivers/input/touchscreen/
          echo "obj-y += fts1ba90a.o" >> drivers/input/touchscreen/Makefile
          cp $GITHUB_WORKSPACE/kernel/drivers/sm5705_fuelgauge.c drivers/power/supply/
          echo "obj-y += sm5705_fuelgauge.o" >> drivers/power/supply/Makefile

      - name: Install device tree
        working-directory: /mnt/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/dts/sm8150-samsung-gts6lwifi.dts arch/arm64/boot/dts/qcom/
          echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8150-samsung-gts6lwifi.dtb' >> arch/arm64/boot/dts/qcom/Makefile

      - name: Configure
        working-directory: /mnt/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/config/gts6lwifi_defconfig-full arch/arm64/configs/gts6lwifi_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gts6lwifi_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build Image + dtbs + modules
        working-directory: /mnt/linux
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=/mnt/mods
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/qcom/sm8150-samsung-gts6lwifi.dtb

      - name: Pack artifacts
        run: |
          cd /mnt/linux
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp arch/arm64/boot/dts/qcom/sm8150-samsung-gts6lwifi.dtb out/gts6.dtb
          cp .config out/kernel.config
          tar -C /mnt/mods -cf out/modules.tar lib/modules
          gzip -9 out/modules.tar || true
          ls -lh out/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gts6lwifi-kernel
          path: /mnt/linux/out/
          retention-days: 90
