name: Build gts6lwifi kernel

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: "Checkout this repo (config/patches/drivers/dts)"
        uses: actions/checkout@v4

      - name: Pick a build directory with enough space
        run: |
          set -e
          RUNDIR="$GITHUB_WORKSPACE/build"
          if [ -d /mnt ] && touch /mnt/.wtest 2>/dev/null; then
            rm -f /mnt/.wtest
            MNTFREE=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
            WSFREE=$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
            if [ "$MNTFREE" -gt "$WSFREE" ]; then RUNDIR=/mnt/build; fi
          fi
          mkdir -p "$RUNDIR"
          echo "RUNDIR=$RUNDIR" >> "$GITHUB_ENV"
          echo "使用构建目录: $RUNDIR"
          df -h "$RUNDIR"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev u-boot-tools cpio rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download mainline 6.12 source
        working-directory: ${{ env.RUNDIR }}
        run: |
          curl -fL --retry 3 -o linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz
          tar -xf linux.tar.xz
          rm -f linux.tar.xz
          mv linux-6.12 linux
          cd linux
          make kernelversion || true

      - name: Apply device patches
        working-directory: ${{ env.RUNDIR }}/linux
        run: |
          set -e
          # two patches use non a/ b/ headers (--- /tmp/... or --- ...orig) which GNU
          # patch cannot resolve with -p1; give their target file explicitly.
          # hunk bodies themselves are bentlybro's patches, byte for byte.
          # cs48l32 codec + sm8250 sndcard: audio chain. The CS48L32 codec driver
          # is bentlybro's private 6.13->6.12 backport, not in his public repo and
          # not in mainline 6.12 - these two cannot be applied or compiled on
          # public sources. Skip until audio is wanted; everything else verbatim.
          for p in $GITHUB_WORKSPACE/kernel/patches/*.patch; do
            case "$(basename $p)" in
              *cs48l32*|*sm8250-sndcard*) echo "== SKIP $(basename $p) (audio; needs unpublished cs48l32 backport)"; continue;;
            esac
            echo "== $(basename $p) =="
            case "$(basename $p)" in
              adc-battery-*) patch --forward drivers/power/supply/generic-adc-battery.c < "$p" || { echo "!! patch failed: $(basename $p)"; exit 1; };;
              mfd-qcom-spmi-*) patch --forward drivers/mfd/qcom-spmi-pmic.c < "$p" || { echo "!! patch failed: $(basename $p)"; exit 1; };;
              *) patch -p1 --forward < "$p" || { echo "!! patch failed: $(basename $p)"; exit 1; };;
            esac
          done

      - name: Install device drivers
        working-directory: ${{ env.RUNDIR }}/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/drivers/fts1ba90a.c drivers/input/touchscreen/
          echo "obj-y += fts1ba90a.o" >> drivers/input/touchscreen/Makefile
          cp $GITHUB_WORKSPACE/kernel/drivers/sm5705_fuelgauge.c drivers/power/supply/
          echo "obj-y += sm5705_fuelgauge.o" >> drivers/power/supply/Makefile

      - name: Install device tree
        working-directory: ${{ env.RUNDIR }}/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/dts/sm8150-samsung-gts6lwifi.dts arch/arm64/boot/dts/qcom/
          echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8150-samsung-gts6lwifi.dtb' >> arch/arm64/boot/dts/qcom/Makefile

      - name: Configure
        working-directory: ${{ env.RUNDIR }}/linux
        run: |
          cp $GITHUB_WORKSPACE/kernel/config/gts6lwifi_defconfig-full arch/arm64/configs/gts6lwifi_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- gts6lwifi_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build Image + dtbs + modules
        working-directory: ${{ env.RUNDIR }}/linux
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=$RUNDIR/mods
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/qcom/sm8150-samsung-gts6lwifi.dtb

      - name: Pack artifacts
        run: |
          cd $RUNDIR/linux
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp arch/arm64/boot/dts/qcom/sm8150-samsung-gts6lwifi.dtb out/gts6.dtb
          cp .config out/kernel.config
          tar -C $RUNDIR/mods -cf out/modules.tar lib/modules
          gzip -9 out/modules.tar || true
          ls -lh out/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gts6lwifi-kernel
          path: ${{ env.RUNDIR }}/linux/out/
          retention-days: 90
